# Fly.io —  fly launch --config demo/deploy/fly.toml --dockerfile Dockerfile --no-deploy
#           fly secrets set ANTHROPIC_API_KEY=sk-...   # optional
#           fly deploy --config demo/deploy/fly.toml --dockerfile Dockerfile
app = "finsight-demo"          # must be globally unique — change me
primary_region = "bom"         # Mumbai; use iad / sjc for US audiences

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1     # keep warm during a demo; set 0 afterwards

  [[http_service.checks]]
    grace_period = "40s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
