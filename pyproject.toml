[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight"
version = "1.0.0"
description = "Executive Cloud Intelligence Layer — Capacitor + Costificator + RAG"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sachin Narayanan" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.39"]
dev = ["pytest>=7.0", "jupyter>=1.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
